name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-contract:
    name: Build & Test Smart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Check Rust Formatting
        run: cargo fmt --check
        working-directory: contract

      - name: Run Clippy Lints
        run: cargo clippy -- -D warnings
        working-directory: contract

      - name: Run Cargo Test
        run: cargo test
        working-directory: contract

      - name: Build Contract WASM
        run: cargo build --target wasm32v1-none --release
        working-directory: contract

      - name: Verify WASM Size (Soroban 64KB Limit)
        run: |
          WASM_FILE="target/wasm32v1-none/release/credchain.wasm"
          if [ -f "$WASM_FILE" ]; then
            WASM_SIZE=$(wc -c < "$WASM_FILE")
            echo "WASM Size: $WASM_SIZE bytes"
            if [ $WASM_SIZE -gt 65536 ]; then
              echo "ERROR: WASM file size ($WASM_SIZE bytes) exceeds the Soroban 64KB (65536 bytes) limit!"
              exit 1
            fi
            echo "WASM size validation passed."
          else
            echo "ERROR: Compiled WASM file not found at $WASM_FILE!"
            exit 1
          fi
        working-directory: contract

  nextjs-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: client

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=critical
        working-directory: client

      - name: Run Linter
        run: npm run lint
        working-directory: client

      - name: Run Tests
        run: npm run test
        working-directory: client

      - name: Build Frontend
        run: npm run build
        working-directory: client
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          # Build-time value only, used to verify the bundle compiles. The address
          # the deployed app actually uses comes from the Vercel project env vars.
          # Keep in sync with client/.env when the contract is redeployed.
          NEXT_PUBLIC_CONTRACT_ADDRESS: CBYG2PMXPMCCMINZ5ZNJSFFLRWBBIEHOKHXQEC5BEXKKZRBL7Y2S4YUK
