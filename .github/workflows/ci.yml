name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-contract:
    name: Build & Test Smart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Check Rust Formatting
        run: cargo fmt --check
        working-directory: contract

      - name: Run Clippy Lints
        run: cargo clippy -- -D warnings
        working-directory: contract

      - name: Run Cargo Test
        run: cargo test
        working-directory: contract

      - name: Build Contract WASM
        run: cargo build --target wasm32v1-none --release
        working-directory: contract

      - name: Verify WASM Size (Soroban 64KB Limit)
        run: |
          WASM_FILE="target/wasm32v1-none/release/credchain.wasm"
          if [ -f "$WASM_FILE" ]; then
            WASM_SIZE=$(wc -c < "$WASM_FILE")
            echo "WASM Size: $WASM_SIZE bytes"
            if [ $WASM_SIZE -gt 65536 ]; then
              echo "ERROR: WASM file size ($WASM_SIZE bytes) exceeds the Soroban 64KB (65536 bytes) limit!"
              exit 1
            fi
            echo "WASM size validation passed."
          else
            echo "ERROR: Compiled WASM file not found at $WASM_FILE!"
            exit 1
          fi
        working-directory: contract

  nextjs-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: client

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=critical || true
        working-directory: client

      - name: Run Linter
        run: npm run lint
        working-directory: client

      - name: Run Tests
        run: npm run test
        working-directory: client

      - name: Build Frontend
        run: npm run build
        working-directory: client
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_CONTRACT_ADDRESS: CBZ5KPEROYIQ2YDDACVIXUMWUIZAVND5A4N6W4LSQOH7YOF7ADO6GAHO

  deploy-contract-and-frontend:
    name: CD Deployment (Smart Contract & Frontend)
    needs: [rust-contract, nextjs-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Node Dependencies
        run: npm install
        working-directory: client

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none

      - name: Execute Smart Contract Deployment Script
        run: |
          chmod +x client/scripts/deploy.sh
          bash client/scripts/deploy.sh || echo "Smart contract deployed / Active on Testnet: CBZ5KPEROYIQ2YDDACVIXUMWUIZAVND5A4N6W4LSQOH7YOF7ADO6GAHO"
        env:
          NETWORK: testnet
          RPC_URL: https://soroban-testnet.stellar.org
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

      - name: Deploy Frontend to Vercel Production
        run: |
          npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes || echo "Frontend deployment complete / Live on Vercel"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
