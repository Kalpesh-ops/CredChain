name: CD Deployment Pipeline

on:
  push:
    branches: [ main ]
  # Contract deployment is manual. A deploy mints a brand-new contract address
  # and orphans all prior on-chain state, so it must not ride on every commit.
  workflow_dispatch:
    inputs:
      deploy_contract:
        description: "Deploy a NEW contract instance (new address, empty state)"
        type: boolean
        default: false

jobs:
  deploy-smart-contract:
    name: Deploy Smart Contract to Stellar Testnet
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none

      # deploy.sh drives the `stellar` CLI end to end (build, deploy, bindings).
      # Without this step every stellar invocation in the script is "command not found".
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      # SOURCE_ACCOUNT names a key in the runner's local keystore. deploy.sh
      # generates and funds it on testnet when absent, and binds it as the
      # contract admin via the constructor.
      - name: Run Contract Deployment Script (deploy.sh)
        run: |
          chmod +x client/scripts/deploy.sh
          bash client/scripts/deploy.sh
        env:
          NETWORK: testnet
          RPC_URL: https://soroban-testnet.stellar.org
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOURCE_ACCOUNT: dev

      - name: Remind to propagate the new address
        run: |
          echo "::warning::A new contract was deployed. Update NEXT_PUBLIC_CONTRACT_ADDRESS in the Vercel project env, client/.env, .github/workflows/ci.yml, and README.md — nothing does this automatically."

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: client

      - name: Deploy Frontend to Vercel Production
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
